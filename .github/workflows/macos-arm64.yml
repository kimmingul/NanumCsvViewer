name: macOS arm64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Use Xcode 26.6 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - name: Install macOS workload
        run: dotnet workload install macos
      - name: Allow this runner Xcode
        run: |
          python3 - <<'PY'
          import pathlib
          files = list(pathlib.Path.home().glob(".dotnet/packs/Microsoft.macOS.Sdk.net10.0_26.0/*/targets/Xamarin.Shared.Sdk.targets"))
          path = files[0]
          text = path.read_text()
          start = text.find("requires Xcode")
          if start < 0:
              raise SystemExit("version check text not found")
          open_at = text.rfind("<Error", 0, start)
          close_at = text.find("/>", start)
          if open_at < 0 or close_at < 0:
              raise SystemExit("Error element not found")
          path.write_text(text[:open_at] + text[close_at + 2:])
          print(f"removed Xcode version Error from {path}")
          PY
      - name: Publish arm64 app
        run: dotnet publish NanumCsvViewer.Mac/NanumCsvViewer.Mac.csproj -c Release -r osx-arm64 --self-contained true
      - name: Package app
        run: |
          set -euo pipefail
          app=$(find NanumCsvViewer.Mac/bin/Release -name '*.app' -type d | head -n 1)
          test -n "$app"
          exe="$app/Contents/MacOS/NanumCsvViewer.Mac"
          file "$exe"
          lipo -info "$exe"
          codesign --force --sign - "$app"
          ditto -c -k --keepParent "$app" NanumCsvViewer-v3.4.3-macos-arm64.zip
      - name: Upload to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.4.3
          files: NanumCsvViewer-v3.4.3-macos-arm64.zip
          fail_on_unmatched_files: true
          append_body: true
          body: |
            macOS arm64 추가 자산은 GitHub Actions macos-26 러너에서 만든 Eto CSV 뷰어입니다. Developer ID 서명과 공증은 없습니다. 최소 OS는 macOS 26이며, Windows 앱의 전체 기능은 포함하지 않습니다.
