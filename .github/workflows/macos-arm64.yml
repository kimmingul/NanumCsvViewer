name: macOS arm64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Use Xcode 26.6 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - name: Install macOS workload
        run: dotnet workload install macos
      - name: Allow this runner Xcode
        run: |
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path.home() / ".dotnet/packs"
          hits = [p for p in root.rglob("*") if p.is_file() and b"requires Xcode" in p.read_bytes()]
          print("hits", len(hits))
          for path in hits:
              text = path.read_text(errors="replace")
              start = text.find("requires Xcode")
              open_at = text.rfind("<Error", 0, start)
              close_at = text.find("/>", start)
              print(path, open_at, close_at)
              if open_at >= 0 and close_at > start:
                  path.write_text(text[:open_at] + text[close_at + 2:])
                  print("removed", path)
          targets = list(root.glob("Microsoft.macOS.Sdk.net10.0_26.0/*/targets/Xamarin.Shared.Sdk.targets"))
          if targets:
              lines = targets[0].read_text(errors="replace").splitlines()
              for i in range(2370, min(len(lines), 2395)):
                  print(f"{i+1}:{lines[i]}")
          if not hits:
              raise SystemExit("version check text not found")
          PY
      - name: Publish arm64 app
        run: dotnet publish NanumCsvViewer.Mac/NanumCsvViewer.Mac.csproj -c Release -r osx-arm64 --self-contained true
      - name: Package app
        run: |
          set -euo pipefail
          app=$(find NanumCsvViewer.Mac/bin/Release -name '*.app' -type d | head -n 1)
          test -n "$app"
          exe="$app/Contents/MacOS/NanumCsvViewer.Mac"
          file "$exe"
          lipo -info "$exe"
          codesign --force --sign - "$app"
          ditto -c -k --keepParent "$app" NanumCsvViewer-v3.4.3-macos-arm64.zip
      - name: Upload to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.4.3
          files: NanumCsvViewer-v3.4.3-macos-arm64.zip
          fail_on_unmatched_files: true
          append_body: true
          body: |
            macOS arm64 추가 자산은 GitHub Actions macos-26 러너에서 만든 Eto CSV 뷰어입니다. Developer ID 서명과 공증은 없습니다. 최소 OS는 macOS 26이며, Windows 앱의 전체 기능은 포함하지 않습니다.
